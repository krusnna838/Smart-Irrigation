<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri Ai | Smart Farming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            /* PROFESSIONAL ACCENT COLORS */
            --header-bg: #1a4d2e;      /* Deep Forest Green Header */
            --primary-light: #4ade80;  /* Bright Emerald Accent */
            --dark-slate: #1e293b;     /* Slate for Titles (Eye-safe) */
            --text-soft: #475569;      /* Soft Blue-Grey for Body text */
            --content-bg: rgba(255, 255, 255, 0.88); /* High-quality Glass */
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            color: var(--text-soft);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            
            /* IMAGE IS KEPT - Reduced overlay to make it pop */
            background: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), 
                        url("{{ url_for('static', filename='background.jpg') }}") no-repeat center center fixed;
            background-size: cover;
        }

        /* --- UPGRADED COLORED HEADER BAR --- */
        nav {
            background: var(--header-bg);
            padding: 0.8rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            color: white; /* Logo stands out on dark green */
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-logo i { color: var(--primary-light); }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Active tab indicator style */
        .nav-links a i { width: 16px; opacity: 0.8; }

        /* --- PROFESSIONAL CONTENT BOX --- */
        .content {
            flex: 1;
            padding: 45px;
            width: 92%;
            max-width: 1200px;
            margin: 40px auto;
            background: var(--content-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
        }

        h1, h2, h3 { color: var(--dark-slate); font-weight: 800; }

        footer {
            text-align: center;
            padding: 2.5rem;
            color: #64748b;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.9);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .status-dot {
            height: 8px; width: 8px;
            background-color: var(--primary-light);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--primary-light);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            nav { padding: 1.2rem; flex-direction: column; gap: 20px; }
            .content { padding: 25px; margin: 20px auto; }
        }
    </style>
</head>
<body>

<nav id="navbar">
    <a href="/" class="nav-logo">
        <i data-lucide="sprout"></i>
        <span>AgriSense <span style="color: rgba(255,255,255,0.7)">AI</span></span>
    </a>
    
    <div class="nav-links">
        <a href="/"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="/predict"><i data-lucide="droplets"></i> Prediction</a>
        <a href="/analytics"><i data-lucide="bar-chart-3"></i> Analytics</a>
        <a href="/system"><i data-lucide="database"></i> System</a>
    </div>
</nav>

<div class="content">
    {% block content %}{% endblock %}
</div>

<footer>
    <p><span class="status-dot"></span> <b>System Node Active</b> | &copy; 2025 AgriSense AI</p>
</footer>

<script>
    lucide.createIcons();
</script>

</body>
</html>
